<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' blob: data: https://res.cloudinary.com https://i.ibb.co; media-src blob: https://res.cloudinary.com; connect-src https://res.cloudinary.com https://i.ibb.co; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#17141c">
<title>네컷 사진 받기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="download.css?v=20261101">
</head>
<body>
<main>
  <header>
    <div class="logo"><span>♥</span><span>✦</span><span>☺</span><span>★</span></div>
    <h1>네컷 사진관</h1>
  </header>

  <div id="inapp" class="banner" hidden>
    <p id="inappText">앱 안에서 열린 화면이라 저장이 안 될 수 있어요.</p>
    <button id="openExternal" class="ghostbtn">기본 브라우저로 열기</button>
  </div>

  <section id="loading" class="card msg">
    <div class="spinner"></div>
    <h2>사진을 준비하고 있어요</h2>
    <p id="loadingText">잠시만 기다려 주세요</p>
  </section>

  <div id="content" hidden>
    <div class="tabs" id="tabs" hidden>
      <button class="tab on" data-tab="photo">사진</button>
      <button class="tab" data-tab="video">움직이는 네컷</button>
    </div>
    <section class="card" id="photoCard">
      <img id="photo" alt="네컷 사진">
      <button class="save" id="savePhoto">사진 저장하기</button>
    </section>
    <section class="card" id="videoCard" hidden>
      <video id="video" autoplay muted loop playsinline></video>
      <button class="save" id="saveVideo">영상 저장하기</button>
    </section>
    <p class="note" id="videoWait" hidden><span class="dot"></span> 움직이는 네컷 영상을 준비하고 있어요</p>
    <p class="note" id="expire"></p>
    <p class="note small" id="tip"></p>
  </div>

  <section id="error" class="card msg" hidden>
    <div class="big">😢</div>
    <h2 id="errTitle">사진을 찾을 수 없어요</h2>
    <p id="errText"></p>
    <button id="retry" class="save small" hidden>다시 시도</button>
    <p id="diag" class="diag"></p>
  </section>
</main>
<div id="toast" class="toast" hidden></div>
<script src="download.js?v=20261101"></script>
</body>
</html>
